name: Daily Prepare Instagram Posts

on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 AM IST — matches existing cron-job.org trigger
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
  repository_dispatch:
    types:
      - daily_prepare

concurrency:
  group: prepare-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests google-genai Pillow

      - name: Run preparation script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: python prepare.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          if [ -f post_log.json ]; then git add post_log.json; fi
          if [ -d "exam upload" ]; then git add "exam upload/"; fi
          if [ -d "uploaded exam" ]; then git add "uploaded exam/"; fi
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "📦 Processed 25 posts from exam upload [automated]"
          git push

